<!doctype html>
<html lang="en" data-role="user">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My deliveries · LogiPulse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%232563eb'/%3E%3Cpath d='M6.5 21h6.2l3.1-8.4 5 16 3.6-9.6h9.1' fill='none' stroke='%23fff' stroke-width='2.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/orders.css" />
  <link rel="stylesheet" href="/css/user.css" />
  <script src="/js/lib/boot.js"></script>
</head>
<body>
  <header id="topbar"></header>

  <main class="page user-page">
    <div class="page-head">
      <div class="fade-up">
        <div class="eyebrow">Customer</div>
        <h1 id="greet">Hello</h1>
        <p>Request a delivery, then watch it move from pickup to your door.</p>
      </div>
      <div class="head-stats fade-up" id="head-stats" style="--i:1"></div>
    </div>

    <div class="user-grid">
      <!-- New request -->
      <aside>
        <section class="card request-card fade-up" style="--i:2" aria-labelledby="req-title">
          <div class="card-head">
            <h3 id="req-title"><span class="icon-bubble" id="req-icon"></span>New delivery request</h3>
          </div>
          <form id="req-form" novalidate>
            <div class="field" id="f-pickup">
              <label for="pickup">Pickup point</label>
              <div class="combo" id="combo">
                <div class="input-wrap">
                  <span id="pickup-icon"></span>
                  <input class="input" id="pickup" placeholder="Search a place or tap the map" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="combo-list" />
                  <button type="button" class="btn btn-ghost btn-icon btn-sm trail" id="locate" title="Use my current location" aria-label="Use my current location"></button>
                </div>
                <ul class="combo-list hidden" id="combo-list" role="listbox"></ul>
              </div>
              <div class="pick-map"><div class="map" id="pick-map"></div><span class="pick-map-hint">Tap the map to drop a pin</span></div>
              <span class="error-text"></span>
            </div>

            <div class="field" id="f-delivery">
              <label for="delivery">Delivery address</label>
              <div class="input-wrap"><span id="delivery-icon"></span><input class="input" id="delivery" placeholder="House, street, area" autocomplete="street-address" maxlength="300" /></div>
              <span class="error-text"></span>
            </div>

            <div class="field" id="f-desc">
              <label for="desc">Package details</label>
              <textarea class="textarea" id="desc" placeholder="What are we delivering? Size, fragile items, instructions for the rider…" maxlength="500"></textarea>
              <div class="char-count"><span id="count">0</span>/500</div>
              <span class="error-text"></span>
            </div>

            <button class="btn btn-primary btn-lg btn-block" id="req-submit" type="submit"><span id="req-label">Request delivery</span></button>
            <div class="form-foot"><span id="foot-icon"></span><span>The nearest available rider will accept your request.</span></div>
          </form>
        </section>
      </aside>

      <!-- Orders -->
      <section>
        <div class="orders-head fade-up" style="--i:2">
          <h2>Your orders</h2>
          <div class="seg" id="filter">
            <button data-value="all" aria-selected="true">All <span class="count" id="c-all">0</span></button>
            <button data-value="active" aria-selected="false">Active <span class="count" id="c-active">0</span></button>
            <button data-value="done" aria-selected="false">Completed <span class="count" id="c-done">0</span></button>
          </div>
        </div>
        <div class="orders-list" id="orders">
          <div class="card skeleton" style="height:176px;border-radius:16px"></div>
          <div class="card skeleton" style="height:176px;border-radius:16px"></div>
        </div>
        <div id="orders-empty"></div>
      </section>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/pages/user.js"></script>
</body>
</html>
