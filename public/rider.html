<!doctype html>
<html lang="en" data-role="rider">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rider · LogiPulse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2310b981'/%3E%3Cpath d='M6.5 21h6.2l3.1-8.4 5 16 3.6-9.6h9.1' fill='none' stroke='%2304140d' stroke-width='2.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/css/design.css" />
  <link rel="stylesheet" href="/css/shell.css" />
  <link rel="stylesheet" href="/css/orders.css" />
  <link rel="stylesheet" href="/css/rider.css" />
  <script src="/js/lib/boot.js"></script>
</head>
<body class="rider-body">
  <header id="topbar"></header>

  <div class="rider-app">
    <aside class="rider-panel" id="panel">

      <!-- Mode: nearby requests -->
      <section id="sec-list" class="panel-sec hidden">
        <div class="panel-head">
          <div>
            <h2>Nearby requests</h2>
            <p class="muted" style="font-size:13px">Nearest first, measured from your location.</p>
          </div>
          <span class="chip" id="open-count">0 open</span>
        </div>

        <div class="loc-card" id="loc-card">
          <span class="loc-ico" id="loc-ico"></span>
          <div class="loc-text"><small>Your location</small><strong class="truncate" id="loc-name">Locating…</strong></div>
          <button class="btn btn-soft btn-sm" id="gps-btn" type="button"></button>
        </div>
        <p class="loc-hint" id="loc-hint"></p>

        <div class="seg filter-seg" id="prio-seg">
          <button data-value="ALL" aria-selected="true">All <span class="count" id="n-ALL">0</span></button>
          <button data-value="URGENT" aria-selected="false">Urgent <span class="count" id="n-URGENT">0</span></button>
          <button data-value="HIGH" aria-selected="false">High <span class="count" id="n-HIGH">0</span></button>
          <button data-value="NORMAL" aria-selected="false">Normal <span class="count" id="n-NORMAL">0</span></button>
        </div>

        <div class="rlist" id="rlist">
          <div class="card skeleton" style="height:210px;border-radius:16px"></div>
          <div class="card skeleton" style="height:210px;border-radius:16px"></div>
        </div>
        <div id="rempty"></div>
      </section>

      <!-- Mode: active delivery -->
      <section id="sec-active" class="panel-sec hidden">
        <div id="active-top"></div>
        <div class="detail-tabs rider-tabs">
          <div class="seg" id="a-tabs">
            <button data-value="order" aria-selected="true">Delivery</button>
            <button data-value="chat" aria-selected="false">Chat <span id="a-chat-dot"></span></button>
          </div>
        </div>
        <div id="a-pane-order" class="tab-pane"></div>
        <div id="a-pane-chat" class="tab-pane hidden"><div class="chat-host rider-chat" id="a-chat"></div></div>
      </section>

      <!-- Mode: offline -->
      <section id="sec-offline" class="panel-sec hidden">
        <div class="offline-card">
          <div class="offline-art" id="offline-art"></div>
          <h2>You are offline</h2>
          <p>Go online to see delivery requests near you and start earning.</p>
          <button class="btn btn-primary btn-lg" id="go-online">Go online</button>
        </div>
      </section>
    </aside>

    <section class="rider-map" aria-label="Map">
      <div class="map" id="map"></div>
      <div class="map-hint" id="map-hint"><span id="hint-ico"></span>Tap the map or drag your marker to move yourself. Distances update instantly.</div>
      <div class="map-fabs">
        <button class="fab" id="fab-fit" title="Fit all on map" aria-label="Fit all on map"></button>
        <button class="fab" id="fab-locate" title="Use my GPS location" aria-label="Use my GPS location"></button>
      </div>
      <div class="map-legend" id="legend">
        <span><i style="background:var(--pr-URGENT-line)"></i>Urgent</span>
        <span><i style="background:var(--pr-HIGH-line)"></i>High</span>
        <span><i style="background:var(--accent)"></i>Normal</span>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/pages/rider.js"></script>
</body>
</html>
