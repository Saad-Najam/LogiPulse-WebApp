# Render blueprint: one web service serving the API, Socket.IO and the static frontend.
# The database is Supabase (external), so DATABASE_URL is entered once in the Render dashboard (sync: false).
services:
  - type: web
    name: logipulse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL        # Supabase *Session pooler* URI (not the direct connection)
        sync: false
      - key: DATABASE_SSL
        value: "true"
